<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Solar System with three.js</title>
        <script src="js/three.js"></script>
        <script src="js/OrbitControls.js"></script>
    </head>
    <body>
        <script>
            //create scene
            const scene = new THREE.Scene();

            //create and initialize camera
            const camera = new THREE.PerspectiveCamera(100, window.innerWidth/window.innerHeight, 1, 1000);
            camera.position.z = 15;

            //create renderer
            const renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            //implementation of basic camera controls
            const controls = new THREE.OrbitControls( camera, renderer.domElement);
            controls.update();

            //allows the resize of the window
            window.addEventListener( 'resize', function( )
        {
            var width = window.innerWidth;
            var height = window.innerHeight;
            renderer.setSize( width, height );
            camera.aspect = width / height;
            camera.updateProjectionMatrix( );
        });

        //creation of sun. Application of textures through URLs
            const texture = new THREE.TextureLoader();
            const sunTexture = texture.load("https://upload.wikimedia.org/wikipedia/commons/a/a4/Solarsystemscope_texture_8k_sun.jpg");
            const sunGeometry = new THREE.SphereGeometry(3);
            const sunMaterial = new THREE.MeshBasicMaterial({map:sunTexture});
            const sun = new THREE.Mesh(sunGeometry, sunMaterial);
            scene.add(sun);

            //Create and apply Point Lighting to mimic sunlight 
            const sunLight = new THREE.PointLight(0xffffff, 2.5);
            sunLight.position.set(0, 0, 0);
            scene.add(sunLight);

            const plutoRadius = 29;

            function animate()
            {
                //Animate scene
                requestAnimationFrame(animate);
                
                //rotate and create orbital cycles for objects
                sun.rotation.x += 0.01;
                sun.rotation.y += 0.01;

                mercury.rotation.x += 0.01;
                mercury.rotation.y += 0.01;
                mercuryAngle += 0.02;
                mercury.position.x = Math.cos(mercuryAngle) * mercuryRadius;
                mercury.position.y = Math.sin(mercuryAngle) * mercuryRadius;

                venus.rotation.x += 0.01;
                venus.rotation.y += 0.01;
                venusAngle += 0.018;
                venus.position.x = Math.cos(venusAngle) * venusRadius;
                venus.position.y = Math.sin(venusAngle) * venusRadius;

                earth.rotation.x += 0.01;
                earth.rotation.y += 0.01;
                earthAngle += 0.016;
                earth.position.x = Math.cos(earthAngle) * earthRadius;
                earth.position.y = Math.sin(earthAngle) * earthRadius;
                moon.rotation.x += 0.01;
                moon.rotation.y += 0.01;
                moon.position.x = earth.position.x + (Math.cos(earthAngle * 2.2)* 1.1);
                moon.position.y = earth.position.y + (Math.sin(earthAngle * 2.2)* 1.1);

                mars.rotation.x += 0.01;
                mars.rotation.y += 0.01;
                marsAngle += 0.014;
                mars.position.x = Math.cos(marsAngle) * marsRadius;
                mars.position.y = Math.sin(marsAngle) * marsRadius;

                jupiter.rotation.x += 0.01;
                jupiter.rotation.y += 0.01;
                jupiterAngle += 0.012;
                jupiter.position.x = Math.cos(jupiterAngle) * jupiterRadius;
                jupiter.position.y = Math.sin(jupiterAngle) * jupiterRadius;
                ganymede.rotation.x += 0.01;
                ganymede.rotation.y += 0.01;
                ganymede.position.x = jupiter.position.x + (Math.cos(jupiterAngle * 2.2)* 2.2);
                ganymede.position.y = jupiter.position.y + (Math.sin(jupiterAngle * 2.2)* 2.2);

                saturn.rotation.x += 0.01;
                saturn.rotation.y += 0.01;
                saturnRings.rotation.x += 0.01;
                saturnRings.rotation.y += 0.01;
                saturnAngle += 0.01;
                saturn.position.x = Math.cos(saturnAngle) * saturnRadius;
                saturn.position.y = Math.sin(saturnAngle) * saturnRadius;
                saturnRingAngle += 0.01;
                saturnRings.position.x = Math.cos(saturnRingAngle) * saturnRingRadius;
                saturnRings.position.y = Math.sin(saturnRingAngle) * saturnRingRadius;
                titan.rotation.x += 0.01;
                titan.rotation.y += 0.01;
                titan.position.x = saturn.position.x + (Math.cos(saturnAngle * 2.2)* 2.7);
                titan.position.y = saturn.position.y + (Math.sin(saturnAngle * 2.2)* 2.7);

                uranus.rotation.x += 0.01;
                uranus.rotation.y += 0.01;
                uranusAngle += 0.009;
                uranus.position.x = Math.cos(uranusAngle) * uranusRadius;
                uranus.position.y = Math.sin(uranusAngle) * uranusRadius;

                neptune.rotation.x += 0.01;
                neptune.rotation.y += 0.01;
                neptuneAngle += 0.008;
                neptune.position.x = Math.cos(neptuneAngle) * neptuneRadius;
                neptune.position.y = Math.sin(neptuneAngle) * neptuneRadius;

                pluto.rotation.x += 0.01;
                pluto.rotation.y += 0.01;
                plutoAngle += 0.007;
                pluto.position.x = Math.cos(plutoAngle) * plutoRadius;
                pluto.position.y = Math.sin(plutoAngle) * plutoRadius;

                
                controls.update();

                //render scene
                renderer.render(scene, camera);
            }
            animate();
        </script>
    </body>
